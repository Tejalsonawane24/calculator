plugins {
    alias(libs.plugins.android.application)
    // REMOVED: id 'com.android.' (This was the cause of your error)
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.example.calculator'

    // FIXED: Changed from version = release(36) to standard syntax
    compileSdk 36

    defaultConfig {
        applicationId "com.example.calculator"
        minSdk 27
        targetSdk 36 // Matches compileSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Use the version catalog (libs.xxx) exclusively to avoid conflicts
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.gridlayout
    implementation libs.recyclerview
    implementation libs.play.services.maps

    // If firebase-database isn't in your catalog yet, keep this one:
    implementation 'com.google.firebase:firebase-database:21.0.0'

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // REMOVED: Hardcoded duplicate implementations that were listed below
}